
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>株式試算カレンダー</title>
<style>
:root{--bg:#f4f6f8;--bg2:#ffffff;--bg3:#f0f2f5;--bd:#dde1e7;--t:#1a1f27;--t2:#6b7280;--t3:#adb5bd;--buy:#16a34a;--buybg:#dcfce7;--sell:#dc2626;--sellbg:#fee2e2;--acc:#2563eb;--gold:#d97706;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--t)}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;height:100vh}
.hdr{background:var(--bg2);border-bottom:1px solid var(--bd);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.htitle{font-size:15px;font-weight:700}.hsub{font-size:10px;color:var(--t2);margin-top:1px}
.hnav{display:flex;gap:6px}
.nbtn{background:var(--bg3);border:1px solid var(--bd);border-radius:7px;color:var(--t);font-size:16px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0}
.tab{flex:1;padding:9px 0;font-size:12px;font-weight:600;text-align:center;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:70px}
.sum-section{padding:10px 10px 0}
.month-block{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.block-head{padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.block-label{font-size:10px;font-weight:700;color:var(--t2)}
.block-net{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.month-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bd)}
.mcard{background:var(--bg2);padding:9px 12px}
.mc-label{font-size:9px;color:var(--t2);margin-bottom:3px}
.mc-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.total-bar{background:var(--bg2);border:1px solid var(--acc);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.total-bar-label{font-size:10px;font-weight:700;color:var(--acc)}
.total-bar-val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.total-bar-sub{font-size:9px;color:var(--t3);margin-top:2px;text-align:right}
.period-block{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:2px}
.period-head{padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.period-head-label{font-size:10px;font-weight:700;color:var(--t2)}
.period-toggle{font-size:12px;color:var(--t3);transition:transform .2s}
.period-toggle.open{transform:rotate(180deg)}
.period-body{display:none;padding:12px}
.period-body.show{display:block}
.period-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.date-field label{font-size:10px;color:var(--t2);display:block;margin-bottom:4px}
.date-field input{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;color:var(--t);font-size:13px;font-weight:600;padding:7px 8px;-webkit-appearance:none}
.date-field input:focus{outline:none;border-color:var(--acc)}
.quick-btns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.qbtn{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;color:var(--t2);font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer;transition:all .15s}
.qbtn:active,.qbtn.active{background:var(--acc);border-color:var(--acc);color:#fff}
.period-result{background:var(--bg3);border-radius:8px;padding:10px 12px;display:none}
.period-result.show{display:block}
.pr-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12px}
.pr-row:last-child{margin-bottom:0}
.pr-label{color:var(--t2)}
.pr-val{font-weight:800;font-variant-numeric:tabular-nums}
.pr-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.pr-total-label{font-size:11px;color:var(--t2)}
.pr-total-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.pos{color:#16a34a}.neg{color:#dc2626}.neu{color:var(--t)}.zero{color:var(--t3)}
.hol-row{padding:0 0 4px}
.hol-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 0}
.hol-icon{font-size:16px}
.hol-label{font-size:12px;color:var(--t2);flex:1}
.hol-switch{width:40px;height:22px;background:var(--bd);border-radius:11px;position:relative;transition:background .2s;flex-shrink:0}
.hol-switch.on{background:var(--sell)}
.hol-knob{position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.hol-switch.on .hol-knob{left:21px}
.hol-name{width:100%;background:var(--bg3);border:1px solid var(--sell);border-radius:7px;color:var(--t);font-size:13px;padding:7px 10px;-webkit-appearance:none;margin-top:6px}
.hol-name:focus{outline:none;border-color:var(--sell)}
.calwrap{padding:8px 10px 4px}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.dow{text-align:center;font-size:10px;font-weight:700;color:var(--t3);padding:2px 0}
.dow:first-child{color:var(--sell)}.dow:last-child{color:var(--acc)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cell{background:var(--bg2);border:1px solid var(--bd);border-radius:7px;padding:4px 3px;min-height:64px;cursor:pointer;overflow:hidden;transition:border-color .12s}
.cell:active{transform:scale(.96)}
.cell.empty{background:transparent;border-color:transparent;cursor:default}.cell.empty:active{transform:none}
.cell.today{border-color:var(--acc)}.cell.selected{border-color:var(--gold);background:#fef9c3}
.cell.sun .cn{color:var(--sell)}.cell.sat .cn{color:var(--acc)}
.cn{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.tdot{width:4px;height:4px;border-radius:50%;background:var(--acc);display:none}
.cell.today .tdot{display:block}
.chdl{font-size:7px;font-weight:700;color:var(--sell);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbuy{font-size:9px;font-weight:700;color:var(--buy);background:var(--buybg);border-radius:3px;padding:1px 3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csell{font-size:9px;font-weight:700;color:var(--sell);background:var(--sellbg);border-radius:3px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnet{font-size:8px;font-weight:800;text-align:right;margin-top:2px;font-variant-numeric:tabular-nums}
.dpanel{margin:0 10px 10px;background:var(--bg2);border:1px solid var(--gold);border-radius:var(--r);display:none;overflow:hidden}
.dpanel.show{display:block}
.dhdr{background:#fefce8;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.ddate{font-size:14px;font-weight:700;color:var(--gold)}
.xbtn{background:var(--bg3);border:1px solid var(--bd);border-radius:5px;color:var(--t2);font-size:14px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dbody{padding:14px}
.drow{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.drow label{font-size:12px;color:var(--t2);width:74px;flex-shrink:0}
.drow input{flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;color:var(--t);font-size:15px;font-weight:700;padding:8px 10px;text-align:right;-webkit-appearance:none;font-variant-numeric:tabular-nums}
.drow input:focus{outline:none;border-color:var(--acc)}
.drow textarea{flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;color:var(--t);font-size:13px;padding:8px 10px;resize:none;height:50px;font-family:inherit}
.drow textarea:focus{outline:none;border-color:var(--acc)}
.dnet{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--bg3);border-top:1px solid var(--bd)}
.dnetl{font-size:12px;color:var(--t2)}.dnetv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.savebtn{display:block;width:calc(100% - 28px);margin:10px 14px 14px;background:var(--acc);border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:700;padding:12px;cursor:pointer}
.savebtn:active{opacity:.8}
.listwrap{padding:10px}
.lmhead{font-size:12px;font-weight:700;color:var(--t2);padding:6px 2px;border-bottom:1px solid var(--bd);margin-bottom:5px}
.litem{background:var(--bg2);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;cursor:pointer}
.litem:active{border-color:var(--gold)}
.lbadge{background:var(--bg3);border-radius:7px;padding:5px 8px;text-align:center;min-width:40px}
.ldnum{font-size:17px;font-weight:800;line-height:1}.ldow{font-size:9px;color:var(--t2);margin-top:1px}
.ldata{flex:1;min-width:0}
.lchips{display:flex;gap:5px;margin-bottom:3px;flex-wrap:wrap}
.chip{font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;font-variant-numeric:tabular-nums}
.chip-buy{color:var(--buy);background:var(--buybg)}.chip-sell{color:var(--sell);background:var(--sellbg)}
.lmemo{font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnet{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.statswrap{padding:10px}
.stitle{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin:14px 0 6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.scard{background:var(--bg2);border:1px solid var(--bd);border-radius:9px;padding:11px 12px}
.scard.wide{grid-column:span 2}
.slabel{font-size:10px;color:var(--t2);margin-bottom:4px}
.sval{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.ssub{font-size:10px;color:var(--t2);margin-top:2px}
.barwrap{margin:4px 0}
.barlabel{display:flex;justify-content:space-between;font-size:10px;color:var(--t2);margin-bottom:3px}
.bartrack{background:var(--bg3);border-radius:3px;height:5px;overflow:hidden}
.barfill{height:100%;border-radius:3px}
.bar-buy{background:var(--buy)}.bar-sell{background:var(--sell)}
.tlist{list-style:none}
.titem{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12px}
.titem:last-child{border-bottom:none}
.tdate{color:var(--t2)}.tval{font-weight:700;font-variant-numeric:tabular-nums}
.fab{position:fixed;bottom:18px;right:18px;width:50px;height:50px;background:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;cursor:pointer;border:none;box-shadow:0 4px 14px rgba(88,166,255,.4);z-index:100;transition:transform .15s}
.fab:active{transform:scale(.9)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:flex-end}
.overlay.show{display:flex}
.sheet{background:var(--bg2);border-radius:16px 16px 0 0;border-top:1px solid var(--bd);padding:8px 0 20px;width:100%;animation:up .2s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.handle{width:34px;height:3px;background:var(--bd);border-radius:2px;margin:0 auto 14px}
.mtitle{font-size:15px;font-weight:700;padding:0 18px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.mbody{padding:16px 18px}
.mrow{margin-bottom:14px}
.mrow label{font-size:12px;color:var(--t2);display:block;margin-bottom:5px}
.mrow input,.mrow textarea{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:9px;color:var(--t);font-size:15px;font-weight:600;padding:9px 12px;-webkit-appearance:none;font-family:inherit}
.mrow input:focus,.mrow textarea:focus{outline:none;border-color:var(--acc)}
.mrow textarea{resize:none;height:60px;font-size:13px;font-weight:400}
.mactions{display:flex;gap:8px;padding:0 18px}
.mcancelbtn{flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:9px;color:var(--t2);font-size:14px;font-weight:600;padding:12px;cursor:pointer}
.maddbtn{flex:2;background:var(--acc);border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:700;padding:12px;cursor:pointer}
.maddbtn:active,.mcancelbtn:active{opacity:.7}
.empty{text-align:center;padding:36px 16px;color:var(--t3);font-size:12px;line-height:1.8}
.empty-icon{font-size:36px;margin-bottom:10px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#3fb950;color:#fff;font-size:12px;font-weight:700;padding:7px 16px;border-radius:18px;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="htitle" id="hdrTitle">2025年5月</div><div class="hsub">信用取引 評価額カレンダー</div></div>
  <div class="hnav">
    <button class="nbtn" id="prevBtn">‹</button>
    <button class="nbtn" id="todayBtn">◉</button>
    <button class="nbtn" id="nextBtn">›</button>
  </div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="cal">📅 カレンダー</div>
  <div class="tab" data-tab="list">📋 一覧</div>
  <div class="tab" data-tab="stats">📊 集計</div>
</div>
<div class="scroll">
  <div id="calView">
    <div class="sum-section" id="sumSection"></div>
    <div class="calwrap">
      <div class="dow-row">
        <div class="dow">日</div><div class="dow">月</div><div class="dow">火</div>
        <div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div>
      </div>
      <div class="calgrid" id="calgrid"></div>
    </div>
    <div class="dpanel" id="dpanel">
      <div class="dhdr"><span class="ddate" id="ddate"></span><button class="xbtn" id="dclose">✕</button></div>
      <div class="dbody">
        <div class="drow"><label>📈 信用買い</label><input type="number" inputmode="numeric" id="dinBuy" placeholder="0"></div>
        <div class="drow"><label>📉 信用売り</label><input type="number" inputmode="numeric" id="dinSell" placeholder="0"></div>
        <div class="drow"><label>📝 メモ</label><textarea id="dinMemo" placeholder="銘柄・メモ（任意）"></textarea></div>
        <div class="hol-row" id="holRow">
          <div class="hol-toggle" id="holToggle">
            <span class="hol-icon">🎌</span>
            <span class="hol-label">祝日登録</span>
            <div class="hol-switch" id="holSwitch"><div class="hol-knob"></div></div>
          </div>
          <input type="text" id="holName" class="hol-name" placeholder="祝日名（例：春分の日）" style="display:none">
        </div>
      </div>
      <div class="dnet"><span class="dnetl">この日の損益（買＋売）</span><span class="dnetv neu" id="dnetval">+¥0</span></div>
      <button class="savebtn" id="saveBtn">保存</button>
    </div>
  </div>
  <div id="listView" style="display:none"><div class="listwrap" id="listwrap"></div></div>
  <div id="statsView" style="display:none"><div class="statswrap" id="statswrap"></div></div>
</div>
<button class="fab" id="fab">＋</button>
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="handle"></div>
    <div class="mtitle"><span>📥 データ入力</span><button class="xbtn" id="mclose">✕</button></div>
    <div class="mbody">
      <div class="mrow"><label>📅 日付</label><input type="date" id="mdate"></div>
      <div class="mrow"><label>📈 信用買い 評価額（円）</label><input type="number" inputmode="numeric" id="mbuy" placeholder="例: 1500000"></div>
      <div class="mrow"><label>📉 信用売り 評価額（円）</label><input type="number" inputmode="numeric" id="msell" placeholder="例: -200000"></div>
      <div class="mrow"><label>📝 メモ（任意）</label><textarea id="mmemo" placeholder="銘柄名やコメントなど"></textarea></div>
    </div>
    <div class="mactions">
      <button class="mcancelbtn" id="mcancel">キャンセル</button>
      <button class="maddbtn" id="msave">💾 保存する</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
const KEY='stk_v4';
const DAYS=['日','月','火','水','木','金','土'];
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const today=new Date();
let cy=today.getFullYear(),cm=today.getMonth(),selKey=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
let D=load();
const HKEY='stk_custom_hol';
function loadHol(){try{return JSON.parse(localStorage.getItem(HKEY)||'{}')}catch{return{}}}
function saveHol(h){localStorage.setItem(HKEY,JSON.stringify(h))}
let CH=loadHol();
function dk(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function getE(k){return D[k]||{buy:0,sell:0,memo:''}}
function setE(k,buy,sell,memo){if(!+buy&&!+sell&&!memo){delete D[k]}else{D[k]={buy:+buy||0,sell:+sell||0,memo:memo||''}}save(D)}
function sy(v){const a=Math.abs(v);const s=a>=100000000?(Math.abs(v)/100000000).toFixed(1)+'億':a>=10000?(Math.abs(v)/10000).toFixed(1)+'万':a.toLocaleString('ja-JP');return(v>0?'+':v<0?'-':'')+s}
function fy(v){return(v>=0?'+':'')+Math.abs(v).toLocaleString('ja-JP')}
function cc(v){return v>0?'pos':v<0?'neg':'zero'}
function pad(n){return String(n).padStart(2,'0')}
function fmtDate(d){return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}

function renderSummary(){
  const dim=new Date(cy,cm+1,0).getDate();
  let mBuy=0,mSell=0;
  for(let d=1;d<=dim;d++){const k=dk(cy,cm,d);if(D[k]){mBuy+=D[k].buy;mSell+=D[k].sell;}}
  const mNet=mBuy+mSell;
  let tBuy=0,tSell=0,tDays=0;
  Object.values(D).forEach(v=>{tBuy+=v.buy;tSell+=v.sell;tDays++;});
  const tNet=tBuy+tSell;
  const ms=mNet>0?'▲':mNet<0?'▼':'';
  const ts=tNet>0?'▲':tNet<0?'▼':'';
  document.getElementById('sumSection').innerHTML=`
    <div class="month-block">
      <div class="block-head">
        <span class="block-label">📅 今月累計（${cy}年${MONTHS[cm]}）</span>
        <span class="block-net ${cc(mNet)}">${ms}¥${Math.abs(mNet).toLocaleString('ja-JP')}</span>
      </div>
      <div class="month-row">
        <div class="mcard"><div class="mc-label">📈 信用買い</div><div class="mc-val ${cc(mBuy)}">${sy(mBuy)}</div></div>
        <div class="mcard"><div class="mc-label">📉 信用売り</div><div class="mc-val ${cc(mSell)}">${sy(mSell)}</div></div>
      </div>
    </div>
    <div class="total-bar">
      <div>
        <div class="total-bar-label">📊 総累計（全期間）</div>
        <div class="total-bar-sub">${tDays}日分のデータ</div>
      </div>
      <div class="total-bar-val ${cc(tNet)}">${ts}¥${Math.abs(tNet).toLocaleString('ja-JP')}</div>
    </div>
    <div class="period-block">
      <div class="period-head" id="periodHead">
        <span class="period-head-label">🔍 期間指定で集計</span>
        <span class="period-toggle" id="periodToggle">▼</span>
      </div>
      <div class="period-body" id="periodBody">
        <div class="period-dates">
          <div class="date-field"><label>開始日</label><input type="date" id="pFrom"></div>
          <div class="date-field"><label>終了日</label><input type="date" id="pTo"></div>
        </div>
        <div class="quick-btns">
          <button class="qbtn" onclick="setQuick('today')">当日</button>
          <button class="qbtn" onclick="setQuick('yesterday')">前日</button>
          <button class="qbtn" onclick="setQuick('week')">今週</button>
          <button class="qbtn" onclick="setQuick('lastweek')">先週</button>
          <button class="qbtn" onclick="setQuick('month')">今月</button>
          <button class="qbtn" onclick="setQuick('lastmonth')">先月</button>
        </div>
        <div class="period-result" id="periodResult">
          <div class="pr-row"><span class="pr-label">📈 信用買い</span><span class="pr-val pos" id="prBuy">+¥0</span></div>
          <div class="pr-row"><span class="pr-label">📉 信用売り</span><span class="pr-val neg" id="prSell">+¥0</span></div>
          <div class="pr-row"><span class="pr-label">📅 対象日数</span><span class="pr-val neu" id="prDays">0日</span></div>
          <div class="pr-total"><span class="pr-total-label">損益合計</span><span class="pr-total-val" id="prNet">+¥0</span></div>
        </div>
      </div>
    </div>`;
  document.getElementById('periodHead').addEventListener('click',togglePeriod);
  document.getElementById('pFrom').addEventListener('change',calcPeriod);
  document.getElementById('pTo').addEventListener('change',calcPeriod);
}

function togglePeriod(){
  const body=document.getElementById('periodBody'),tog=document.getElementById('periodToggle');
  tog.classList.toggle('open',body.classList.toggle('show'));
}
function setQuick(type){
  const now=new Date();let from,to;
  if(type==='today'){from=to=fmtDate(now)}
  else if(type==='yesterday'){const d=new Date(now);d.setDate(d.getDate()-1);from=to=fmtDate(d)}
  else if(type==='week'){const d=new Date(now);d.setDate(d.getDate()-d.getDay());from=fmtDate(d);to=fmtDate(now)}
  else if(type==='lastweek'){const end=new Date(now);end.setDate(end.getDate()-end.getDay()-1);const start=new Date(end);start.setDate(start.getDate()-6);from=fmtDate(start);to=fmtDate(end)}
  else if(type==='month'){from=`${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;to=fmtDate(now)}
  else if(type==='lastmonth'){const lm=new Date(now.getFullYear(),now.getMonth(),0);const ls=new Date(now.getFullYear(),now.getMonth()-1,1);from=fmtDate(ls);to=fmtDate(lm)}
  document.getElementById('pFrom').value=from;document.getElementById('pTo').value=to;calcPeriod();
}
function calcPeriod(){
  const from=document.getElementById('pFrom').value,to=document.getElementById('pTo').value;
  if(!from||!to)return;
  let pBuy=0,pSell=0,pDays=0;
  Object.entries(D).forEach(([k,v])=>{if(k>=from&&k<=to){pBuy+=v.buy;pSell+=v.sell;pDays++;}});
  const pNet=pBuy+pSell;
  document.getElementById('periodResult').classList.add('show');
  document.getElementById('prBuy').textContent=(pBuy>=0?'+':'')+Math.abs(pBuy).toLocaleString('ja-JP');
  document.getElementById('prBuy').className='pr-val '+cc(pBuy);
  document.getElementById('prSell').textContent=(pSell>=0?'+':'')+Math.abs(pSell).toLocaleString('ja-JP');
  document.getElementById('prSell').className='pr-val '+cc(pSell);
  document.getElementById('prDays').textContent=pDays+'日';
  document.getElementById('prNet').textContent=(pNet>=0?'+':'')+Math.abs(pNet).toLocaleString('ja-JP');
  document.getElementById('prNet').className='pr-total-val '+cc(pNet);
}

function isHoliday(k){return!!(HOLIDAYS[k]||CH[k])}
function holidayName(k){return CH[k]||HOLIDAYS[k]||''}
function isCustomHol(k){return!!CH[k]}
function setCustomHol(k,name){if(name===null){delete CH[k]}else{CH[k]=name||'祝日'}saveHol(CH)}

function renderCal(){
  D=load();
  document.getElementById('hdrTitle').textContent=`${cy}年${MONTHS[cm]}`;
  renderSummary();
  const dim=new Date(cy,cm+1,0).getDate(),fd=new Date(cy,cm,1).getDay();
  let html='';
  for(let i=0;i<fd;i++)html+='<div class="cell empty"></div>';
  for(let d=1;d<=dim;d++){
    const k=dk(cy,cm,d),e=D[k],dow=new Date(cy,cm,d).getDay();
    const isTd=(cy===today.getFullYear()&&cm===today.getMonth()&&d===today.getDate());
    const isHol=isHoliday(k),isRed=dow===0||isHol;
    let cls='cell'+(isRed?' sun':dow===6?' sat':'')+(isTd?' today':'')+(k===selKey?' selected':'');
    let bh='',sh='',nh='',hh='';
    if(isHol)hh=`<div class="chdl">${holidayName(k)}</div>`;
    if(e){if(e.buy)bh=`<div class="cbuy">${sy(e.buy)}</div>`;if(e.sell)sh=`<div class="csell">${sy(e.sell)}</div>`;const n=e.buy+e.sell;nh=`<div class="cnet ${cc(n)}">${sy(n)}</div>`;}
    html+=`<div class="${cls}" onclick="selDay('${k}')"><div class="cn">${d}<span class="tdot"></span></div>${hh}${bh}${sh}${nh}</div>`;
  }
  document.getElementById('calgrid').innerHTML=html;
  if(selKey)renderDetail(selKey);
}

function selDay(k){selKey=k;renderCal();renderDetail(k);const p=document.getElementById('dpanel');p.classList.add('show');setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function renderDetail(k){
  const e=getE(k),[y,m,d]=k.split('-').map(Number),dow=new Date(y,m-1,d).getDay();
  document.getElementById('ddate').textContent=`${y}年${m}月${d}日（${DAYS[dow]}）`;
  document.getElementById('dinBuy').value=e.buy||'';
  document.getElementById('dinSell').value=e.sell||'';
  document.getElementById('dinMemo').value=e.memo||'';
  const isCH=isCustomHol(k),isFixedHol=!!HOLIDAYS[k];
  const sw=document.getElementById('holSwitch'),nm=document.getElementById('holName');
  if(isFixedHol){
    document.getElementById('holRow').style.display='none';
  } else {
    document.getElementById('holRow').style.display='';
    sw.classList.toggle('on',isCH);
    nm.style.display=isCH?'block':'none';
    nm.value=isCH?(CH[k]==='祝日'?'':CH[k]):'';
  }
  updNet();
}
function updNet(){const b=+document.getElementById('dinBuy').value||0,s=+document.getElementById('dinSell').value||0,n=b+s;const el=document.getElementById('dnetval');el.textContent=(n>=0?'+':'')+Math.abs(n).toLocaleString('ja-JP');el.className='dnetv '+(n>0?'pos':n<0?'neg':'neu')}
document.getElementById('dinBuy').addEventListener('input',updNet);
document.getElementById('dinSell').addEventListener('input',updNet);
document.getElementById('saveBtn').addEventListener('click',()=>{
  if(!selKey)return;
  setE(selKey,document.getElementById('dinBuy').value,document.getElementById('dinSell').value,document.getElementById('dinMemo').value);
  if(!HOLIDAYS[selKey]){
    const sw=document.getElementById('holSwitch');
    if(sw.classList.contains('on')){setCustomHol(selKey,document.getElementById('holName').value.trim()||'祝日')}
    else{setCustomHol(selKey,null)}
    CH=loadHol();
  }
  renderCal();toast('保存しました ✓');
});
document.getElementById('dclose').addEventListener('click',()=>{selKey=null;document.getElementById('dpanel').classList.remove('show');renderCal()});
document.getElementById('holToggle').addEventListener('click',()=>{
  const sw=document.getElementById('holSwitch'),nm=document.getElementById('holName');
  const on=sw.classList.toggle('on');
  nm.style.display=on?'block':'none';
  if(on)nm.focus();
});

function renderList(){
  D=load();const entries=Object.entries(D).sort((a,b)=>b[0].localeCompare(a[0]));
  if(!entries.length){document.getElementById('listwrap').innerHTML='<div class="empty"><div class="empty-icon">📭</div>まだデータがありません<br>＋ボタンから入力してください</div>';return}
  const groups={};entries.forEach(([k,v])=>{const ym=k.slice(0,7);if(!groups[ym])groups[ym]=[];groups[ym].push([k,v])});
  let html='';
  Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([ym,items])=>{
    const[y,m]=ym.split('-').map(Number);let mb=0,ms=0;items.forEach(([,v])=>{mb+=v.buy;ms+=v.sell});const mn=mb+ms;
    html+=`<div class="lmhead">${y}年${MONTHS[m-1]}　月計: <span class="${cc(mn)}">${mn>=0?'+':''}¥${Math.abs(mn).toLocaleString('ja-JP')}</span></div>`;
    items.forEach(([k,v])=>{
      const[,,d]=k.split('-').map(Number),dow=new Date(k).getDay(),n=v.buy+v.sell;
      const chips=(v.buy?`<span class="chip chip-buy">買 ${v.buy>=0?'+':''}¥${Math.abs(v.buy).toLocaleString()}</span>`:'')+( v.sell?`<span class="chip chip-sell">売 ${v.sell>=0?'+':''}¥${Math.abs(v.sell).toLocaleString()}</span>`:'');
      html+=`<div class="litem" onclick="goDate('${k}')"><div class="lbadge"><div class="ldnum" style="color:${dow===0?'var(--sell)':dow===6?'var(--acc)':'var(--t)'}">${d}</div><div class="ldow">${DAYS[dow]}</div></div><div class="ldata"><div class="lchips">${chips}</div>${v.memo?`<div class="lmemo">${v.memo}</div>`:''}</div><div class="lnet ${cc(n)}">${sy(n)}</div></div>`;
    });
  });
  document.getElementById('listwrap').innerHTML=html;
}
function goDate(k){const[y,m]=k.split('-').map(Number);cy=y;cm=m-1;selKey=k;switchTab('cal');setTimeout(()=>{renderCal();document.getElementById('dpanel').classList.add('show')},60)}

function renderStats(){
  D=load();const entries=Object.entries(D);
  if(!entries.length){document.getElementById('statswrap').innerHTML='<div class="empty"><div class="empty-icon">📊</div>データがまだありません</div>';return}
  let tB=0,tS=0,maxP=-Infinity,maxL=Infinity,mpk='',mlk='',pos=0,neg=0;const mmap={};
  entries.forEach(([k,v])=>{tB+=v.buy;tS+=v.sell;const n=v.buy+v.sell;if(n>maxP){maxP=n;mpk=k}if(n<maxL){maxL=n;mlk=k}if(n>0)pos++;else if(n<0)neg++;const ym=k.slice(0,7);if(!mmap[ym])mmap[ym]={buy:0,sell:0};mmap[ym].buy+=v.buy;mmap[ym].sell+=v.sell});
  const tN=tB+tS,total=entries.length,mb2=Math.max(Math.abs(tB),Math.abs(tS))||1;
  const fk=k=>{if(!k)return'-';const[,m,d]=k.split('-').map(Number);return`${m}/${d}`};
  const trendHtml=Object.entries(mmap).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6).map(([ym,v])=>{const[y,m]=ym.split('-').map(Number),n=v.buy+v.sell;return`<li class="titem"><span class="tdate">${y}年${MONTHS[m-1]}</span><span class="tval ${cc(n)}">${n>=0?'+':''}¥${Math.abs(n).toLocaleString('ja-JP')}</span></li>`}).join('');
  document.getElementById('statswrap').innerHTML=`
    <div class="stitle">▍ 全期間サマリー</div>
    <div class="sgrid">
      <div class="scard wide"><div class="slabel">累計 損益合計</div><div class="sval ${cc(tN)}">${tN>=0?'+':''}¥${Math.abs(tN).toLocaleString('ja-JP')}</div><div class="ssub">全 ${total} 日分</div></div>
      <div class="scard"><div class="slabel">信用買い累計</div><div class="sval ${cc(tB)}">${sy(tB)}</div></div>
      <div class="scard"><div class="slabel">信用売り累計</div><div class="sval ${cc(tS)}">${sy(tS)}</div></div>
    </div>
    <div class="stitle">▍ 比率</div>
    <div class="scard" style="margin-bottom:6px">
      <div class="barwrap"><div class="barlabel"><span>📈 信用買い</span><span class="${cc(tB)}">${sy(tB)}</span></div><div class="bartrack"><div class="barfill bar-buy" style="width:${(Math.abs(tB)/mb2*100).toFixed(0)}%"></div></div></div>
      <div class="barwrap" style="margin-top:8px"><div class="barlabel"><span>📉 信用売り</span><span class="${cc(tS)}">${sy(tS)}</span></div><div class="bartrack"><div class="barfill bar-sell" style="width:${(Math.abs(tS)/mb2*100).toFixed(0)}%"></div></div></div>
    </div>
    <div class="stitle">▍ 記録</div>
    <div class="sgrid">
      <div class="scard"><div class="slabel">最高益日</div><div class="sval pos">${mpk?sy(maxP):'-'}</div><div class="ssub">${fk(mpk)}</div></div>
      <div class="scard"><div class="slabel">最大損失日</div><div class="sval neg">${mlk?sy(maxL):'-'}</div><div class="ssub">${fk(mlk)}</div></div>
      <div class="scard"><div class="slabel">プラス日数</div><div class="sval pos">${pos}日</div></div>
      <div class="scard"><div class="slabel">マイナス日数</div><div class="sval neg">${neg}日</div></div>
    </div>
    <div class="stitle">▍ 月別推移（直近6ヶ月）</div>
    <div class="scard"><ul class="tlist">${trendHtml}</ul></div>`;
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.getElementById('calView').style.display=name==='cal'?'':'none';
  document.getElementById('listView').style.display=name==='list'?'':'none';
  document.getElementById('statsView').style.display=name==='stats'?'':'none';
  if(name==='cal')renderCal();if(name==='list')renderList();if(name==='stats')renderStats();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

document.getElementById('todayBtn').addEventListener('click',()=>{cy=today.getFullYear();cm=today.getMonth();selKey=null;document.getElementById('dpanel').classList.remove('show');renderCal()});

overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
document.getElementById('msave').addEventListener('click',()=>{

  setTimeout(()=>{renderCal();document.getElementById('dpanel').classList.add('show')},60);toast('保存しました ✓');

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',1800)}
