<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="株カレンダー">
<title>株カレンダー</title>
<style>
:root {
  --buy: #1D9E75;
  --buy-bg: #E1F5EE;
  --sell: #D85A30;
  --sell-bg: #FAECE7;
  --gold: #BA7517;
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #263145;
  --border: #334155;
  --text: #e2e8f0;
  --muted: #64748b;
  --dim: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, 'Hiragino Sans', sans-serif; color: var(--text); }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

header { background: rgba(15,23,42,0.97); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.nav { display: flex; align-items: center; gap: 10px; }
.nav button { background: var(--surface); border: 1px solid var(--border); color: var(--dim); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
#mlabel { font-size: 16px; font-weight: 700; min-width: 115px; text-align: center; }
.tbtn { background: var(--surface); border: 1px solid var(--border); color: var(--dim); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-family: inherit; }

#summary { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex-shrink: 0; }
.sc { background: var(--surface2); border-radius: 10px; padding: 7px 10px; }
.sl { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
.sv { font-size: 13px; font-weight: 600; font-family: 'Courier New', monospace; }
.sv.buy { color: var(--buy); }
.sv.sell { color: var(--sell); }
.sv.pos { color: var(--buy); }
.sv.neg { color: var(--sell); }
.sv.zero { color: var(--dim); }

#wdays { display: grid; grid-template-columns: repeat(7,1fr); padding: 6px 8px 2px; flex-shrink: 0; }
.wd { text-align: center; font-size: 10px; font-weight: 600; letter-spacing: .05em; }
.wd.s { color: var(--sell); }
.wd.sa { color: #60a5fa; }
.wd.n { color: var(--muted); }

#grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; padding: 4px 8px 16px; align-content: start; }
#grid::-webkit-scrollbar { width: 3px; }
#grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.cell { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 5px; min-height: 76px; cursor: pointer; display: flex; flex-direction: column; transition: border-color .1s; }
.cell:hover { border-color: var(--buy); }
.cell.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
.cell.today { border-color: var(--gold); border-width: 1.5px; }
.cell.has-data { background: var(--surface2); }
.dn { font-size: 10px; font-weight: 500; color: var(--dim); margin-bottom: 3px; }
.dn.td { color: var(--gold); font-weight: 700; }
.dn.su { color: var(--sell); }
.dn.st { color: #60a5fa; }
.tag { font-size: 7px; font-weight: 700; padding: 1px 3px; border-radius: 3px; letter-spacing: .05em; }
.tag.b { background: #085041; color: #9FE1CB; }
.tag.s { background: #4A1B0C; color: #F5C4B3; }
.cr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1px; }
.cv { font-size: 8px; font-family: 'Courier New', monospace; font-weight: 600; }
.cv.b { color: var(--buy); }
.cv.s { color: var(--sell); }
.cn { font-size: 9px; font-family: 'Courier New', monospace; font-weight: 700; text-align: right; margin-top: 3px; padding-top: 2px; border-top: 1px solid var(--border); }
.cn.p { color: var(--buy); }
.cn.n { color: var(--sell); }
.cn.z { color: var(--muted); }

#ov { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s; }
#ov.open { opacity: 1; pointer-events: all; }
#sh { background: var(--surface); border: 1px solid var(--border); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; padding: 18px 18px 36px; transform: translateY(100%); transition: transform .22s cubic-bezier(.4,0,.2,1); }
#ov.open #sh { transform: translateY(0); }
.hnd { width: 32px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
#stitle { font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 16px; }
#stitle span { color: var(--muted); font-weight: 400; }
.ig { margin-bottom: 12px; }
.il { font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 5px; display: flex; align-items: center; gap: 5px; letter-spacing: .05em; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.b { background: var(--buy); }
.dot.s { background: var(--sell); }
.ir { display: flex; align-items: center; gap: 8px; }
.ir input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: 'Courier New', monospace; font-size: 15px; padding: 10px 12px; border-radius: 10px; outline: none; -webkit-appearance: none; }
.ir input:focus { border-color: var(--buy); }
.ir span { font-size: 12px; color: var(--muted); }
.note { font-size: 9px; color: var(--muted); text-align: center; margin-top: 3px; }
.nb { background: var(--surface2); border-radius: 10px; padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.nl { font-size: 12px; color: var(--muted); }
.nv { font-size: 17px; font-weight: 700; font-family: 'Courier New', monospace; }
.nv.p { color: var(--buy); }
.nv.n { color: var(--sell); }
.nv.z { color: var(--dim); }
.br { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.bsave { background: var(--buy); color: #fff; border: none; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.bdel { background: transparent; color: var(--sell); border: 1px solid var(--sell); padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.bcan { width: 100%; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); padding: 13px; border-radius: 12px; font-size: 14px; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="nav">
      <button id="prev">‹</button>
      <div id="mlabel"></div>
      <button id="next">›</button>
    </div>
    <button class="tbtn" id="todayBtn">今日</button>
  </header>
  <div id="summary">
    <div class="sc"><div class="sl">信用買 累計</div><div class="sv buy" id="sBuy">¥0</div></div>
    <div class="sc"><div class="sl">信用売 累計</div><div class="sv sell" id="sSell">¥0</div></div>
    <div class="sc"><div class="sl">損益 累計</div><div class="sv zero" id="sNet">¥0</div></div>
  </div>
  <div id="wdays">
    <div class="wd s">日</div><div class="wd n">月</div><div class="wd n">火</div>
    <div class="wd n">水</div><div class="wd n">木</div><div class="wd n">金</div>
    <div class="wd sa">土</div>
  </div>
  <div id="grid"></div>
</div>

<div id="ov">
  <div id="sh">
    <div class="hnd"></div>
    <div id="stitle"></div>
    <div class="ig">
      <div class="il"><span class="dot b"></span>信用買い 評価損益</div>
      <div class="ir"><input type="number" id="iBuy" placeholder="0" inputmode="numeric"><span>円</span></div>
      <div class="note">プラス＝評価益 / マイナス＝評価損</div>
    </div>
    <div class="ig">
      <div class="il"><span class="dot s"></span>信用売り 評価損益</div>
      <div class="ir"><input type="number" id="iSell" placeholder="0" inputmode="numeric"><span>円</span></div>
      <div class="note">プラス＝評価益 / マイナス＝評価損</div>
    </div>
    <div class="nb">
      <span class="nl">合計損益</span>
      <span class="nv z" id="mNet">¥0</span>
    </div>
    <div class="br">
      <button class="bsave" id="bSave">保存</button>
      <button class="bdel" id="bDel">削除</button>
    </div>
    <button class="bcan" id="bCan">キャンセル</button>
  </div>
</div>

<script>
const KEY = 'stk_v1';
let data = {};
try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {} };

const td = new Date();
let yr = td.getFullYear(), mo = td.getMonth(), ek = null;

const fmt = n => { const v=Number(n)||0; return (v>=0?'¥':'-¥')+Math.abs(v).toLocaleString('ja-JP'); };
const fmtS = n => { const v=Number(n)||0,a=Math.abs(v),s=v<0?'-':''; if(a>=1000000) return s+(a/1000000).toFixed(1)+'M'; if(a>=10000) return s+Math.round(a/1000)+'K'; return s+a.toLocaleString('ja-JP'); };
const dk = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

function renderSum() {
  let tb=0,ts=0;
  for(const v of Object.values(data)){ tb+=v.buy!==undefined?Number(v.buy):0; ts+=v.sell!==undefined?Number(v.sell):0; }
  const tn=tb+ts;
  document.getElementById('sBuy').textContent=fmt(tb);
  document.getElementById('sSell').textContent=fmt(ts);
  const el=document.getElementById('sNet');
  el.textContent=fmt(tn);
  el.className='sv '+(tn>0?'pos':tn<0?'neg':'zero');
}

function render() {
  document.getElementById('mlabel').textContent=`${yr}年 ${mo+1}月`;
  const g=document.getElementById('grid'); g.innerHTML='';
  const first=new Date(yr,mo,1).getDay(), days=new Date(yr,mo+1,0).getDate();
  for(let i=0;i<first;i++){const b=document.createElement('div');b.className='cell empty';g.appendChild(b);}
  for(let d=1;d<=days;d++){
    const dow=(first+d-1)%7, key=dk(yr,mo,d), e=data[key]||{};
    const buy=e.buy!==undefined?Number(e.buy):null, sell=e.sell!==undefined?Number(e.sell):null;
    const has=buy!==null||sell!==null, net=(buy||0)+(sell||0);
    const isTd=td.getFullYear()===yr&&td.getMonth()===mo&&td.getDate()===d;
    const cell=document.createElement('div');
    cell.className='cell'+(isTd?' today':'')+(has?' has-data':'');
    const nc=isTd?'dn td':dow===0?'dn su':dow===6?'dn st':'dn';
    let h=`<div class="${nc}">${d}</div>`;
    if(has){
      if(buy!==null&&buy!==0) h+=`<div class="cr"><span class="tag b">買</span><span class="cv b">${fmtS(buy)}</span></div>`;
      if(sell!==null&&sell!==0) h+=`<div class="cr"><span class="tag s">売</span><span class="cv s">${fmtS(sell)}</span></div>`;
      h+=`<div class="cn ${net>0?'p':net<0?'n':'z'}">${fmtS(net)}</div>`;
    }
    cell.innerHTML=h;
    cell.addEventListener('click',()=>open(yr,mo,d));
    g.appendChild(cell);
  }
  renderSum();
}

function updNet(){
  const b=Number(document.getElementById('iBuy').value)||0, s=Number(document.getElementById('iSell').value)||0, n=b+s;
  const el=document.getElementById('mNet'); el.textContent=fmt(n); el.className='nv '+(n>0?'p':n<0?'n':'z');
}
function open(y,m,d){
  ek=dk(y,m,d); const e=data[ek]||{};
  const dws=['日','月','火','水','木','金','土'];
  document.getElementById('stitle').innerHTML=`${y}年${m+1}月${d}日 <span>(${dws[new Date(y,m,d).getDay()]})</span>`;
  document.getElementById('iBuy').value=e.buy!==undefined?e.buy:'';
  document.getElementById('iSell').value=e.sell!==undefined?e.sell:'';
  updNet();
  document.getElementById('ov').classList.add('open');
}
function close(){document.getElementById('ov').classList.remove('open');ek=null;}

document.getElementById('prev').addEventListener('click',()=>{mo--;if(mo<0){mo=11;yr--;}render();});
document.getElementById('next').addEventListener('click',()=>{mo++;if(mo>11){mo=0;yr++;}render();});
document.getElementById('todayBtn').addEventListener('click',()=>{yr=td.getFullYear();mo=td.getMonth();render();});
document.getElementById('iBuy').addEventListener('input',updNet);
document.getElementById('iSell').addEventListener('input',updNet);
document.getElementById('bSave').addEventListener('click',()=>{
  const bv=document.getElementById('iBuy').value, sv=document.getElementById('iSell').value;
  if(bv===''&&sv===''){delete data[ek];}
  else{data[ek]={};if(bv!=='')data[ek].buy=Number(bv);if(sv!=='')data[ek].sell=Number(sv);}
  persist();close();render();
});
document.getElementById('bDel').addEventListener('click',()=>{delete data[ek];persist();close();render();});
document.getElementById('bCan').addEventListener('click',close);
document.getElementById('ov').addEventListener('click',e=>{if(e.target===document.getElementById('ov'))close();});

render();
</script>
</body>
</html>
